[project]
name = "sensos"
version = "0.1.0"
description = "SensOS: installable entry point wiring Semantic Annotator's RuntimeBridge onto a Linux inference backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "semantic-annotator",
]

[tool.uv.sources]
semantic-annotator = { path = "../semantic_annotator", editable = true }

[project.scripts]
sensos = "sensos.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["sensos"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["sensos"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=sensos --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/sensos"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
