worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream observation_runtime {
        server observation-runtime:8090;
    }

    upstream semantic_annotator {
        server semantic-annotator:8011;
    }

    upstream hext_stream {
        server hext-stream:8030;
    }

    upstream hekb_projection {
        server hekb-projection:8080;
    }

    upstream nvs_runtime {
        server nvs-runtime:8020;
    }

    upstream dashboard {
        server dashboard:80;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /observation/ {
            proxy_pass http://observation_runtime/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /annotator/ {
            proxy_pass http://semantic_annotator/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /hext/ {
            proxy_pass http://hext_stream/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /hekb/ {
            proxy_pass http://hekb_projection/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /runtime/ {
            proxy_pass http://nvs_runtime/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
