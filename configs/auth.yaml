# NVS Runtime Server — Authentication Configuration
# Phase37-B

jwt:
  # Template only. Override with NVS_JWT_SECRET from the environment.
  # Never commit a real signing secret. This placeholder is rejected at startup
  # when auth is enabled unless NVS_SKIP_STARTUP_VALIDATION is set.
  secret: "CHANGE_ME_IN_PRODUCTION"
  algorithm: "HS256"
  access_token_expire_minutes: 60
  refresh_token_expire_days: 7
  issuer: "nvs-runtime"
  audience: "nvs-clients"

  scopes:
    - name: "generate"
      description: "Run LLM generation with DAK monitoring"
    - name: "diagnose"
      description: "Run DAK diagnostics on a trajectory"
    - name: "replay"
      description: "Replay a .traj file"
    - name: "policy"
      description: "Read/write DAK policies"
    - name: "admin"
      description: "Administrative operations (metrics, policy management)"
    - name: "stream"
      description: "Subscribe to SSE event streams"

  roles:
    user:
      scopes: ["generate", "diagnose", "stream"]
    analyst:
      scopes: ["generate", "diagnose", "replay", "policy", "stream"]
    admin:
      scopes: ["generate", "diagnose", "replay", "policy", "admin", "stream"]

api_keys:
  # Static API keys for service-to-service auth (hashes only — never plaintext).
  # Disabled in this template. Enable only after replacing hashes with your own.
  # Format: key_id: {key_hash, scopes, description}
  # Generate: python3 -c "import hashlib; print(hashlib.sha256(b'YOUR_SECRET').hexdigest())"
  example_key:
    key_hash: "CHANGE_ME"
    scopes: ["generate", "diagnose", "stream"]
    description: "Template API key entry — disabled"
    enabled: false

clients:
  # OAuth2 client-credentials registry for POST /auth/token.
  # secret_hash must be a SHA-256 hex digest of a secret you generate.
  # Disabled in this template. Enable only after replacing the placeholder.
  example_client:
    secret_hash: "CHANGE_ME"
    scopes: ["generate", "diagnose", "stream"]
    description: "Template client entry — disabled"
    enabled: false

# Enforce HTTPS in production deployments.
require_https: false
