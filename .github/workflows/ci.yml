# SensOS product CI skeleton
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-gates:
    name: Product gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx PyYAML

      - name: Forbid HEKB core vendoring markers
        run: |
          python <<'PY'
          from pathlib import Path
          banned = [
              "hekb-core/",
              "vendor/hekb",
              "third_party/hekb",
          ]
          hits = []
          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if any(part in {".git", ".venv", "node_modules"} for part in p.parts):
                  continue
              text = str(p).replace("\\", "/")
              for b in banned:
                  if b in text:
                      hits.append(text)
          if hits:
              raise SystemExit("Forbidden HEKB vendoring paths:\n" + "\n".join(hits))
          print("BOUNDARY_OK")
          PY

      - name: Ruff (product Python paths)
        run: |
          ruff check \
            services/observation-runtime/sensos \
            services/nvs-runtime/runtime \
            services/semantic-annotator \
            integrations/hekb-mcp \
            integrations/hekb-projection \
            --output-format=github
        continue-on-error: true

      - name: Compose config
        env:
          # CI-only non-secret placeholders so compose interpolation succeeds.
          # Not usable as production credentials; NVS Runtime rejects CHANGE_ME.
          POSTGRES_PASSWORD: ci-compose-interpolation-only
          NVS_JWT_SECRET: ci-compose-interpolation-only-not-for-production-use
        run: docker compose --env-file /dev/null -f compose/docker-compose.yml config >/dev/null

      - name: Docker build (core product images)
        run: |
          docker build -t sensos/observation-runtime:ci services/observation-runtime
          docker build -t sensos/semantic-annotator:ci services/semantic-annotator
          docker build -t sensos/gateway:ci services/gateway
          docker build -t sensos/dashboard:ci services/dashboard
