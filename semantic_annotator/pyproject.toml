[project]
name = "semantic-annotator"
version = "0.1.0"
description = "SensOS observation interface: converts Reality Observations into Annotated Observations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm"]

[project.scripts]
semantic-annotator = "semantic_annotator:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["semantic_annotator"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["semantic_annotator"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "mlx_lm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=semantic_annotator --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/semantic_annotator"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
