[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sensos-inference"
version = "0.1.0"
description = "Minimal InferenceProvider / InferenceResult types and a Llama-3.1-8B-Instruct MLX provider (additive; no existing SensOS module changed)"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy"]

[project.optional-dependencies]
mlx = ["mlx-lm"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
